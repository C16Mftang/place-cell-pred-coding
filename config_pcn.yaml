program: place_cell_pcn_sweep.py
project: pcn_sweep_abrupt
name: search_v0
method: bayes

metric:
  goal: minimize
  name: energy

parameters:
  learning_rate:
    distribution: log_uniform_values
    min: 0.00005
    max: 0.001
  inf_lr:
    distribution: log_uniform_values
    min: 0.001
    max: 0.1
    
early_terminate:
  type: hyperband
  min_iter: 10

command:
- python
- ${program}
- --batch_size
- "1"
- --sample_size
- "1000"
- --n_epochs
- "100"
- --is_wandb
- "True"
- --sweep
- "True"